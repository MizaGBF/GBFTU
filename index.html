	<link rel="dns-prefetch" href="https://prd-game-a-granbluefantasy.akamaized.net/" />
	<script>
		try
		{
			document.documentElement.setAttribute(
				"data-theme",
				(
					localStorage.getItem("gbfml-theme") == 1
					? "light"
					: "dark"
				)
			);
		} catch(_unused_) {
			document.documentElement.setAttribute("data-theme", "dark");
		}
	</script>
</head>
<body onload="init()">
	<header class="header-container">
		<a href="index.html">
			<img class="header-icon" src="assets/webp/icon.webp">
		</a>
		<div class="header-content">
			<div class="header-line header-text">
				<span class="header-word-group"><span class="header-colored-capitalized">G</span>ranblue</span>&nbsp;<span class="header-word-group"><span class="header-colored-capitalized">F</span>antasy</span>&nbsp;<span class="header-word-group"><span class="header-colored-capitalized">T</span>ool</span>&nbsp;<span class="header-word-group"><span class="header-colored-capitalized">U</span>tility</span>
			</div>
			<div class="header-line">
				<button class="theme-toggle" onclick="toggle_theme();"></button>
				<a class="sub-link-btn" href="../GBFAL" title="Asset Lookup"><img class="mini-btn-icon" src="../GBFAL/assets/webp/icon.webp" /> Assets</a>
				<a class="sub-link-btn" href="../GBFAL/spark.html" title="Spark Maker"><img class="mini-btn-icon" src="../GBFAL/assets/webp/spark/moon.webp" /> Spark</a>
				<a class="sub-link-btn" href="../GBFAL/ranker.html" title="Character Ranker"><img class="mini-btn-icon" src="../GBFML/assets/webp/icon/appear.webp" /> Ranker</a>
				<a class="sub-link-btn" href="../GBFAL/smash.html" title="Smash or Pass"><img class="mini-btn-icon" src="../GBFAL/assets/webp/smash/smash.webp" /> Smash</a>
				<a class="sub-link-btn" href="../GBFAP" title="Animation Player"><img class="mini-btn-icon" src="../GBFAP/assets/webp/icon.webp" /> Animations</a>
			</div>
		</div>
	</header>
	<!-- Tab buttons -->
	<div class="margin">
		<button class="tab-button" id="tab-spark-tracker" alt="index" onclick="open_tool('spark-tracker')"><img class="tab-button-icon" src="assets/webp/ui/spark_tracker/crystal.webp" />Spark Tracker</button>
		<button class="tab-button" id="tab-bullet-tracker" alt="index" onclick="open_tool('bullet-tracker')"><img class="tab-button-icon" src="assets/webp/ui/bullet_tracker/icon.webp" />Bullet Tracker</button>
		<button class="tab-button" id="tab-advyrnture" alt="index" onclick="open_tool('advyrnture')"><img class="tab-button-icon" src="assets/webp/ui/advyrnture/icon.webp" />Advyrnture</button>
		<button class="tab-button" id="tab-ccw-tracker" alt="index" onclick="open_tool('ccw-tracker')"><img class="tab-button-icon" src="assets/webp/ui/ccw_tracker/icon.webp" />CCW Tracker</button>
		<button class="tab-button" id="tab-roll-sim" alt="index" onclick="open_tool('roll-sim')"><img class="tab-button-icon" src="assets/webp/ui/roll_sim/ssr.webp" />Gacha Sim.</button>
		<button class="tab-button" id="tab-damage" alt="index" onclick="open_tool('damage')"><img class="tab-button-icon" src="assets/webp/ui/damage/icon.webp" />DMG Calc.</button>
		<button class="tab-button" id="tab-defense" alt="index" onclick="open_tool('defense')"><img class="tab-button-icon" src="assets/webp/ui/defense/icon.webp" />Defense Calc.</button>
		<button class="tab-button" id="tab-raziel" alt="index" onclick="open_tool('raziel')"><img class="tab-button-icon" src="assets/webp/ui/raziel/icon.webp" />S. Raziel</button>
		<button class="tab-button" id="tab-kirin-calc" alt="index" onclick="open_tool('kirin-calc')"><img class="tab-button-icon" src="assets/webp/ui/kirin_calc/omega.webp" />Anima Calc.</button>
		<button class="tab-button" id="tab-binomial" alt="index" onclick="open_tool('binomial')"><img class="tab-button-icon" src="assets/webp/ui/binomial/icon.webp" />Roll Chance</button>
		<button class="tab-button" id="tab-youtube-search" alt="index" onclick="open_tool('youtube-search')"><img class="tab-button-icon" src="assets/webp/ui/youtube_search/yt_icon.webp" />Vid. Search</button>
		<button class="tab-button" id="tab-jp-coop" alt="index" onclick="open_tool('jp-coop')"><img class="tab-button-icon" src="assets/webp/ui/jp_coop/icon.webp" />Coop Help</button>
		<button class="tab-button" id="tab-account-start" alt="index" onclick="open_tool('account-start')"><img class="tab-button-icon" src="assets/webp/ui/account_start/icon.webp" />Account Start</button>
		<button class="tab-button" id="tab-screen-tester" alt="index" onclick="open_tool('screen-tester')"><img class="tab-button-icon" src="assets/webp/ui/screen_tester/icon.webp" />Screen Tester</button>
		<button class="tab-button" id="tab-jukebox" alt="jukebox" onclick="open_tool('jukebox')"><img class="tab-button-icon" src="../GBFML/assets/webp/icon/jukebox.webp" />Jukebox</button>
		<button class="tab-button" id="tab-save-management" alt="index" onclick="open_tool('save-management')"><img class="tab-button-icon" src="assets/webp/ui/save_management/icon.webp" />Local Data</button>
	</div>
	<!-- Content area -->
	<div id="content" class="tab-content">
		<div style="height:100px"> <!-- Placeholder-->
